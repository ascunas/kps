jQuery(function() {
	var $ = jQuery;

    $('.input-daterange').datepicker({
        format: "yyyy.mm.dd",

        forceParse: false,

    $(document).ready(function() {

        // 빈 데이터 예제
        const emptyData = [];

        // grid.js 초기화
        new gridjs.Grid({
            columns: ["번호", "이름", "부서", "직급"],
            data: emptyData,

            }
        }).render(document.getElementById("emptyGrid"));

        
        // 신청내역 그리드
        const sampleData = [
            ["기안", "신규", "연차", "2025.10.10~2025.10.13", "16시간", true, "개인사정", "홍길동", "김팀장", "2025.10.13", "12345678"],

            ["결재", "변경전", "연차(오전)", "2025.10.10 09:00~14:00", "4시간", true, "개인사정", "이영희", "박부장", "2025.10.13", "87654321"],

        ];

        // 상태 → 라벨 HTML
        function renderStatusLabel(status) {
            const map = {
                "기안": "status-draft",
                "결재": "status-approved",
                "반려": "status-rejected",                
                "저장": "status-saved",
                "완료": "status-completed",
            };
            const cls = map[status] || "status-draft";
            return gridjs.html(`<span class="status-label ${cls}">${status}</span>`);
        }

        // 첨부파일 아이콘
        function renderFileIcon(hasFile) {
            return hasFile ? gridjs.html(`<span class="file-icon">📎</span>`) : "";
        }

        // 근태유형 → 상세페이지 링크
        function renderDetailLink(cell, rowIndex) {
            const detailUrl = `/attendance-detail.html?id=${rowIndex + 1}`;
            return gridjs.html(`<a href="${detailUrl}" class="detail-link">${cell}</a>`);
        }

        // 모든 셀에 div 래핑
        function wrapInDiv(cell) {
            const content = cell !== null && cell !== undefined ? cell.toString() : '';
            return gridjs.html(`<div class="cell-wrapper">${content}</div>`);
        }

        // Grid.js 초기화

            columns: [

                    name: "상태",
                    formatter: (cell) => renderStatusLabel(cell),
                    width: "80px",
                    attributes: {
                        class: "status-cell"
                    }
                },
                {
                    name: "구분",
                    formatter: (cell) => wrapInDiv(cell)
                },
                {
                    name: "근태유형",
                    formatter: (cell, row, index) => renderDetailLink(cell, index),
                    attributes: {
                        style: "text-align: left;"
                    }
                },
                {
                    name: "근태기간",
                    formatter: (cell) => wrapInDiv(cell)
                },
                {
                    name: "일/시간",
                    formatter: (cell) => wrapInDiv(cell)
                },

                    name: "첨부파일",

                    name: "근태사유",
                    formatter: (cell) => wrapInDiv(cell)
                },

                },

                container: 'my-grid-wrap'

        // 공통 셀 래퍼 함수
        function wrapCell(content) {
            return gridjs.html(`<div class="cell-wrapper">${content ?? ""}</div>`);
        }

        // 연차쿼터 상세 데이터
        const annualData = [
            ["당해연차", "2024.11.19", "2028.11.18", "184.00", "0.00", "184.00"],

            ["이월연차", "2024.11.19", "2028.11.18", "176.00", "176.00", "0.00"],
            ["", "", "소계", "712.00", "440.00", "272.00"],
            ["선사용", "2024.11.19", "2028.11.18", "80.00", "0.00", "80.00"],
            ["", "", "합계", "792.00", "440.00", "352.00"]
        ];

        // Grid 생성
        const grid = new gridjs.Grid({
            columns: [
            { name: "구분", formatter: (cell) => wrapCell(cell) },
            { name: "생성일", formatter: (cell) => wrapCell(cell) },

            { name: "사용", formatter: (cell) => wrapCell(cell), attributes: { style: "text-align:right;" } },
            { name: "잔여", formatter: (cell) => wrapCell(cell), attributes: { style: "text-align:right;" } }

            search: false,
            pagination: false

        // Grid 렌더 완료 후 행별 class 부여
        setTimeout(() => {
            const rows = document.querySelectorAll("#annualGrid table tbody tr");
            rows.forEach((row) => {
            const cells = row.querySelectorAll("td");
            if (!cells.length) return;
            const label = cells[2]?.textContent?.trim();
            if (label === "소계") {
                row.classList.add("subtotal-row");
            } else if (label === "합계") {

            }
            });
        }, 300);

    // 연차쿼터 도우넛 챠트

                    bottom: 0
                }
            }
        }
    });

});

<script>
    $(document).ready(function() {
        // 1. 기본 Select2
        $('.fn-select').select2({
            placeholder: '선택하세요',
            allowClear: true
        });
        
        // 선택 변경 이벤트 리스너
        $('.js-basic-single, .js-grouped, .js-no-search').on('change', function() {
            console.log('선택된 값:', $(this).val());
        });
        
        $('.js-multiple, .js-tags').on('change', function() {
            console.log('선택된 값들:', $(this).val());
        });
    });
    
    // 단일 선택값 조회
    function getValue(selectId) {
        const value = $('#' + selectId).val();
        const text = $('#' + selectId + ' option:selected').text();
        const resultBox = $('#result' + selectId.replace('select', ''));
        
        if (value) {
            resultBox.html(
                '<h4>✅ 선택된 값:</h4>' +
                '<p><strong>Value:</strong> ' + value + '</p>' +
                '<p><strong>Text:</strong> ' + text + '</p>'
            );
            resultBox.addClass('show');
        } else {
            alert('선택된 항목이 없습니다.');
            resultBox.removeClass('show');
        }
    }

    // Select 초기화
    function resetSelect(selectId) {
        $('#' + selectId).val(null).trigger('change');
        $('#result' + selectId.replace('select', '')).removeClass('show');
        alert('초기화되었습니다.');
    }
    
    // 프로그래밍으로 값 설정
    function setValueProgrammatically(selectId, value) {
        $('#' + selectId).val(value).trigger('change');
        alert('값이 설정되었습니다: ' + value);
    }
</script>
